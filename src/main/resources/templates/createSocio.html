<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" >
<head>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script><title>Insert title here</title>
<title>Create Socio</title>
</head>
<body>
	<nav th:insert="~{fragments/navigation :: block-navigation('Creazione socio')}"></nav>
	<div class="container-fluid mt-2" align="center">
		<div th:if="${errorMsg}" class="alert-danger" th:text="${errorMsg}"></div>
	
		<form class="form-content" th:action="@{saveSocio}" th:object="${socio}"
			method="post"
			style="width: 50%; margin: auto">
			<table class="table table-secondary m-25">
				<tr>
					<td><label class="form-label">Nome</label></td>
					<td><input type="text" th:field="*{nome}" placeholder="es. Paolo"></input></td>				
				</tr>
				<tr>
					<td><label class="form-label">Cognome</label></td>
					<td><input type="text" th:field="*{cognome}" placeholder="es. Rossi"></input></td>				
				</tr>
				<tr>
					<td><label class="form-label">Codice Fiscale</label></td>
					<td><input type="text" th:field="*{codiceFiscale}" placeholder="es. RSI...."></input></td>				
				</tr>
				<tr>
					<td><label class="form-label">Email</label></td>
					<td><input type="email" th:field="*{email}" placeholder="es. pross@aa.it"></input></td>				
				</tr>
			</table>
			
			<div class="mt-4" align="center">
			 	<button type="submit" class="btn btn-primary">Registra socio</button>
			</div>
		</form>
	
	</div>


</body>
</html>
