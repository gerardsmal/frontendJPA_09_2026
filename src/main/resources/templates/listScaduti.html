<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" >
<head>
<meta charset="UTF-8">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<title>List Certificati scaduti</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<header th:insert="~{fragments/navigation :: block-navigation('Soci senza o con certificati medico scaduti')}"></header>
	<div class="container-fluid mt-3" align="center">
		<table class="table table-secondary" style="width: 60%; text-align: center">
			<thead>
				<th>Cognome</th>
				<th>nome</th>
				<th>Certificato Medico</th>
			</thead>
			
			<tbody>
				<tr th:each="socio : ${listsocio}">
					<td align="center">[[${socio.cognome}]]</td>
					<td align="center">[[${socio.nome}]]</td>
					<td class="noselect">
						<a th:href="@{updateCertificatoMedico(id=${socio.id})}">
							<span th:text="${socio.certificato} != null ? ${#temporals.format(socio.certificato.dataCerticifato, 'dd/MM/yyyy')} : 'senza'"></span>
						</a>
					</td>
				</tr>
			</tbody>
		
		
		</table>
	</div>
</body>
</html>
